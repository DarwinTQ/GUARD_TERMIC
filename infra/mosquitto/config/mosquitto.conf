# Mosquitto - perfil de desarrollo local (red LAN de confianza).
#
# Dos listeners porque los clientes hablan protocolos distintos:
#   1883 -> MQTT sobre TCP        (ESP32 / PubSubClient)
#   9001 -> MQTT sobre WebSocket  (Flutter web y app movil/desktop)

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# Un nodo lento no debe tumbar al broker.
max_queued_messages 1000
message_size_limit 8192

listener 1883 0.0.0.0
protocol mqtt

listener 9001 0.0.0.0
protocol websockets

# ATENCION: acceso anonimo. Valido solo en LAN local / demo.
# Para exponerlo fuera: allow_anonymous false + password_file.
allow_anonymous true
